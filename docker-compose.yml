# WorkBuddy2API-Hub v0.1.2
#
# 先构建镜像，再启动：
#   docker build -f Dockerfile.local -t workbuddy2api-hub:0.1.2 .   # 基镜像不可达时用这个
#   docker build -t workbuddy2api-hub:0.1.2 .                      # 能访问 Docker Hub 时用这个
#   docker compose up -d
#
# 面板密码放在同目录的 .env（权限 0600，root 独占）：
#   PANEL_PASSWORD=<你的随机强密码>
# 不配的话面板会用默认密码 admin —— 同网段任何机器都能打开面板。

services:
  wb-proxy:
    image: workbuddy2api-hub:0.1.2
    container_name: wb-proxy
    restart: unless-stopped
    # 默认 root(0:0)，即历史行为。想用自己的宿主机用户就设
    # PUID=$(id -u) PGID=$(id -g)，并保证 ./accounts 与 ./usage 对该 uid 可写。
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      # 宿主机端口:容器端口（右侧必须与下面的 PORT 保持一致）
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # 留空则启动时自动生成高强度 API Key 写入 ./accounts/settings.json
      # - API_KEY=your_secret_key
      - TZ=Asia/Shanghai
    volumes:
      # 持久化数据目录：升级与重建容器时绝不丢失配置与用量
      - ./accounts:/app/accounts
      - ./usage:/app/usage
    # --lan 监听所有网卡并强制要求 API Key；--panel-password 覆盖默认面板密码 admin
    command: ["python", "wb_proxy.py", "--host", "0.0.0.0", "--lan", "--panel-password", "${PANEL_PASSWORD}"]
